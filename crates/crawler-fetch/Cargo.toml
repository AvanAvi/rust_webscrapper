[package]
name = "crawler-fetch"
description = "SSRF-guarded HTTP fetching with strict size and time limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Allows the loopback-only address policy used to reach the local mock-site in tests.
# Off by default; the crawlerd binary must never enable it.
# Also exposes test-only TLS roots and transport diagnostics.
test-policy = []

[dependencies]
crawler-core = { path = "../crawler-core" }
http.workspace = true
reqwest.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net", "sync"] }
tower.workspace = true
tower-http = { workspace = true, features = ["decompression-gzip", "decompression-deflate", "decompression-br"] }
url.workspace = true

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
mock-site = { path = "../mock-site" }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true

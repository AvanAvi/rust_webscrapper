[package]
name = "crawler-fetch"
description = "SSRF-guarded HTTP fetching with strict size and time limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Allows the loopback-only address policy used to reach the local mock-site in tests.
# Off by default; the crawlerd binary must never enable it.
test-policy = []

[dependencies]
crawler-core = { path = "../crawler-core" }
http.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tower.workspace = true
tower-http = { workspace = true, features = ["decompression-gzip", "decompression-deflate", "decompression-br"] }
url.workspace = true

[dev-dependencies]
mock-site = { path = "../mock-site" }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

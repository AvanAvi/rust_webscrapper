# cargo-deny configuration. Keys verified against the cargo-deny book on 2026-10-26.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
confidence-threshold = 0.93
# Only licenses actually present; add new ones deliberately when a dependency needs them.
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", use-instead = "rustls", reason = "no OpenSSL linking (project rule 7)" },
    { crate = "openssl-sys", use-instead = "rustls", reason = "no OpenSSL linking (project rule 7)" },
    { crate = "native-tls", use-instead = "rustls", reason = "no OpenSSL linking (project rule 7)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

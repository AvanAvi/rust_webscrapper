# Local development Postgres for proofcrawl. Never use it for real data. Driven by scripts/dev-db.sh;
# see docs/DEVELOPMENT.md.
#
# Compatibility: this file must also work with older Docker and Compose versions, down to
# docker-compose 1.29 (v1) and docker compose 2.0. It therefore has no top-level `name:` (the
# script passes -p), no `version:`, and uses `mem_limit` instead of `deploy.resources`, which v1
# ignores without --compatibility.
services:
  postgres:
    # Exact tag, never `latest`: PostgreSQL 18.6 on Debian bookworm, linux/amd64 available.
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
    ports:
      # Loopback only: the dev database must never be reachable from the network.
      - "127.0.0.1:${DEV_DB_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18+ images keep PGDATA at /var/lib/postgresql/18/docker and declare the volume
      # at /var/lib/postgresql. Mounting the pre-18 path /var/lib/postgresql/data would NOT persist.
      - pgdata:/var/lib/postgresql
    # Sized for an 8 GiB host whose Docker Desktop VM has about 2 GiB.
    mem_limit: 512m
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      # DEV ONLY: the three settings below trade crash safety for speed on a slow laptop. A crash
      # of the Docker VM can corrupt the cluster; recover with `scripts/dev-db.sh reset --yes`.
      # Never copy them into any configuration that holds real ledger data.
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off

volumes:
  pgdata:

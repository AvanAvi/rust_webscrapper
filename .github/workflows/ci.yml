name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain pinned in rust-toolchain.toml (with rustfmt and clippy).
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Loopback mock-site scenarios need the test-only address policy.
      - run: cargo clippy -p crawler-fetch --features test-policy --all-targets --locked -- -D warnings
      - run: cargo test -p crawler-fetch --features test-policy --locked
      - run: ./scripts/check-no-test-policy.sh
      - run: ./scripts/check-no-test-policy-selftest.sh
      - run: ./scripts/check-fetch-deps.sh
      - run: cargo run --locked -p convention-check
      - run: ./scripts/lint-probe.sh

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      # The cache key includes the toolchain because the tools are built with it.
      - id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - id: tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: cargo-tools-ubuntu-24.04-rust-${{ steps.toolchain.outputs.channel }}-audit-${{ env.CARGO_AUDIT_VERSION }}-deny-${{ env.CARGO_DENY_VERSION }}
      - if: steps.tools-cache.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}" "cargo-deny@${CARGO_DENY_VERSION}"
      - run: cargo audit
      - run: cargo deny check

  # Local development Postgres: the same pinned image as docker-compose.dev.yml, with
  # the throwaway credentials from .env.example. No Rust build.
  dev-db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: proofcrawl
          POSTGRES_PASSWORD: proofcrawl-dev-only
          POSTGRES_DB: proofcrawl
        ports:
          - 127.0.0.1:55432:5432
    env:
      DEV_DB_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: /bin/bash scripts/check-dev-db-config.sh
      # Readiness check: pg_isready inside the service container, no host psql.
      - name: readiness check (service container, DATABASE_URL honored)
        env:
          DATABASE_URL: postgres://proofcrawl:proofcrawl-dev-only@127.0.0.1:55432/proofcrawl
          DEV_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: /bin/bash scripts/dev-db.sh status
      - name: DATABASE_URL set, up starts no container
        env:
          DATABASE_URL: postgres://proofcrawl:proofcrawl-dev-only@127.0.0.1:55432/proofcrawl
        run: |
          /bin/bash scripts/dev-db.sh up
          test -z "$(docker ps -a -q --filter label=com.docker.compose.project=proofcrawl-dev)"
      # The service already holds 55432, so the compose container uses another loopback port.
      - name: dev-db persistence test (compose)
        env:
          DEV_DB_PORT: "55433"
        run: /bin/bash scripts/check-dev-db-persistence.sh

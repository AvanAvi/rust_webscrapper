# Throwaway binary that enables crawler-fetch/test-policy; check-no-test-policy.sh must FAIL on it.
[package]
name = "probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "probe"
path = "src/main.rs"

[dependencies]
crawler-fetch = { path = "@CRAWLER_FETCH@", features = ["test-policy"] }

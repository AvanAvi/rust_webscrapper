[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
thiserror = "2.0.21"
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "std", "macros"] }
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
